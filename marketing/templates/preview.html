<!doctype html>

  .desktop .bar i { width: 4.5px; height: 4.5px; border-radius: 50%; background: #e2d4db; }
  .desktop .shot { display: block; width: 100%; }
  .phone { position: absolute; left: 204px; top: 64px; width: 88px; height: 188px; border-radius: 15px; overflow: hidden; border: 3.5px solid #1c1917; background: #fff; box-shadow: 0 14px 30px rgba(40, 3, 18, .55); }
